{% extends "admin/change_form.html" %}
{% load i18n admin_urls static %}

{% block object-tools-items %}
  {% if original.pk %}
    <li>
      <div class="admin-changeform-ai-toolbar" style="display: inline-flex; align-items: center; gap: 8px; vertical-align: middle; margin-right: 8px;">
        <!-- Botão 1: Análise Padrão Gratuita -->
        <button type="button" class="admin-ai-action-btn btn-ai-free" data-item-id="{{ original.pk }}" data-item-title="{{ original.titulo }}" title="Executar Análise de IA Completa no modo Padrão Gratuito (Google Lens Nativo + Vision + Gemini)" style="display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: #4338ca; background: #eef2ff; border: 1px solid #c7d2fe; padding: 4px 10px; border-radius: 6px; cursor: pointer; text-decoration: none; transition: all 0.15s ease; white-space: nowrap;">
          <svg viewBox="0 0 24 24" style="width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/><path d="M5 3v4"/><path d="M19 17v4"/></svg>
          <span>Análise IA (Grátis)</span>
        </button>

        <!-- Botão 2: Google Lens Profundo (SerpApi On-Demand) + Cota Sutil -->
        <button type="button" class="admin-ai-action-btn admin-serpapi-btn btn-ai-serpapi" data-item-id="{{ original.pk }}" data-item-title="{{ original.titulo }}" data-serpapi="1" title="Executar Busca Visual Reversa Profunda com Google Lens (SerpApi - Opção On-Demand)" style="display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: #b45309; background: #fffbeb; border: 1px solid #fde68a; padding: 4px 10px; border-radius: 6px; cursor: pointer; text-decoration: none; transition: all 0.15s ease; white-space: nowrap;">
          <svg viewBox="0 0 24 24" style="width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <span>Google Lens Profundo</span>
          <span class="serpapi-quota-badge" id="serpapi-quota-badge" title="Cota restante no seu plano SerpApi para este mês" style="font-size: 10px; font-weight: 700; color: #92400e; background: #fef3c7; border: 1px solid #fcd34d; padding: 1.5px 6px; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: -0.2px;">{{ serpapi_quota.formatted|default:"243/250 rest." }}</span>
        </button>
      </div>
    </li>
  {% endif %}
  {{ block.super }}
{% endblock %}
