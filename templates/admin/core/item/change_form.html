{% extends "admin/change_form.html" %}
{% load i18n admin_urls static %}

{% block object-tools-items %}
  {% if original.pk %}
    <li>
      <div class="admin-changeform-ai-toolbar" style="display: inline-flex; align-items: center; gap: 8px; vertical-align: middle;">
        <!-- Botão 1: Análise Padrão Gratuita -->
        <button type="button" class="admin-ai-action-btn btn-ai-free" data-item-id="{{ original.pk }}" data-item-title="{{ original.titulo }}" title="Executar Análise de IA Completa no modo Padrão Gratuito (Google Lens Nativo + Vision + Gemini)" style="display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: #4338ca; background: #eef2ff; border: 1px solid #c7d2fe; padding: 4px 10px; border-radius: 6px; cursor: pointer; text-decoration: none; transition: all 0.15s ease;">
          <span style="font-size: 12px;">🤖</span>
          <span>Análise IA (Grátis)</span>
        </button>

        <!-- Botão 2: Google Lens Profundo (SerpApi On-Demand) + Cota Sutil -->
        <button type="button" class="admin-ai-action-btn admin-serpapi-btn btn-ai-serpapi" data-item-id="{{ original.pk }}" data-item-title="{{ original.titulo }}" data-serpapi="1" title="Executar Busca Visual Reversa Profunda com Google Lens (SerpApi - Opção Premium On-Demand)" style="display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; color: #b45309; background: #fffbeb; border: 1px solid #fde68a; padding: 4px 10px; border-radius: 6px; cursor: pointer; text-decoration: none; transition: all 0.15s ease;">
          <span style="font-size: 12px;">🔍</span>
          <span>Google Lens Profundo</span>
          <span class="serpapi-quota-badge" id="serpapi-quota-badge" title="Cota restante no seu plano SerpApi para este mês" style="font-size: 9.5px; font-weight: 700; color: #92400e; background: #fef3c7; border: 1px solid #fcd34d; padding: 1px 5px; border-radius: 4px; margin-left: 2px; letter-spacing: -0.2px; font-family: ui-monospace, monospace;">...</span>
        </button>
      </div>
    </li>
  {% endif %}
  {{ block.super }}
{% endblock %}
