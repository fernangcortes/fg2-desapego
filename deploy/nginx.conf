upstream desapego_app_server {
    server unix:/tmp/gunicorn_desapego.sock fail_timeout=0;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Limite de tamanho de upload para fotos da câmera
    client_max_body_size 30M;

    # Compactação Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Arquivos Estáticos (CSS, JS, Ícones PWA)
    location /static/ {
        alias /var/www/hub-desapego/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Arquivos de Mídia (Fotos dos Itens enviadas pelos usuários)
    location /media/ {
        alias /var/www/hub-desapego/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Service Worker e Manifest PWA
    location = /static/service-worker.js {
        alias /var/www/hub-desapego/static/service-worker.js;
        add_header Cache-Control "no-cache";
    }

    location = /static/manifest.json {
        alias /var/www/hub-desapego/static/manifest.json;
        add_header Cache-Control "public, max-age=3600";
    }

    # Proxy para a aplicação Django via Gunicorn
    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_redirect off;

        if (!-f $request_filename) {
            proxy_pass http://desapego_app_server;
            break;
        }
    }

    # Logs de acesso e erro do Nginx
    access_log /var/log/nginx/desapego_access.log;
    error_log /var/log/nginx/desapego_error.log;
}
